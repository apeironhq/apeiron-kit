<svg
  class="guest-tag-svg"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 520"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <linearGradient id="tagPaper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--tag-light, #fffefa)" />
      <stop offset="55%" stop-color="var(--tag-color, #faf7ef)" />
      <stop offset="100%" stop-color="var(--tag-dark, #eee9dc)" />
    </linearGradient>

    <radialGradient id="tagHighlight" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tagGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--gold-highlight, #fff3bf)"/>
      <stop offset="20%" stop-color="var(--gold-light, #e5c57d)"/>
      <stop offset="43%" stop-color="var(--gold-main, #c7953f)"/>
      <stop offset="62%" stop-color="var(--gold-dark, #98671e)"/>
      <stop offset="80%" stop-color="var(--gold-main, #c7953f)"/>
      <stop offset="100%" stop-color="var(--gold-highlight, #fff1b7)"/>
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="55%" stop-color="#000000" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".35"/>
    </linearGradient>

    <filter id="paperTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".7"
        numOctaves="2"
        seed="15"
        result="noise"
      />

      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="gray"
      />

      <feComponentTransfer in="gray" result="softNoise">
        <feFuncA type="table" tableValues="0 .035"/>
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="softNoise"
        mode="multiply"
      />
    </filter>

    <filter id="tagShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow
        dx="0"
		dy="10"
		stdDeviation="10"
		flood-color="#000000"
		flood-opacity=".16"
      />
    </filter>

    <filter id="metalShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="3"
        flood-color="#69440d"
        flood-opacity=".28"
      />
    </filter>

    <clipPath id="tagClip">
      <rect
        x="65"
        y="185"
		width="570"
		height="270"
		rx="34"
		class="guest-tag__paper-clip"
      />
    </clipPath>
  </defs>

  <g filter="url(#metalShadow)">
    <!-- Connector is painted before the ring so the ring reads as the joint. -->
    <rect
      x="340"
      y="121"
      width="20"
      height="102"
      rx="10"
      fill="url(#tagGold)"
    />

    <rect
      x="344"
      y="126"
      width="5"
      height="92"
      rx="3"
      fill="#fff7d2"
      opacity=".55"
    />

    <g transform="translate(350 88) scale(.6) translate(-350 -88)">
      <circle
        cx="350"
        cy="88"
        r="47"
        fill="none"
        stroke="url(#tagGold)"
        stroke-width="14"
      />

      <circle
        cx="350"
        cy="88"
        r="47"
        fill="none"
        stroke="#fff5c5"
        stroke-width="2"
        opacity=".55"
      />

      <circle
        cx="350"
        cy="88"
        r="37"
        fill="none"
        stroke="#7e5416"
        stroke-width="2"
        opacity=".55"
      />
    </g>

    <circle
      cx="350"
      cy="205"
      r="24"
      fill="url(#tagGold)"
    />

    <circle
      cx="350"
      cy="205"
      r="15"
      fill="#85591a"
    />

    <circle
      cx="350"
      cy="205"
      r="10"
      fill="#f5db95"
    />
  </g>

	<g class="guest-tag__paper-group" filter="url(#tagShadow)">
    <rect
      x="65"
      y="185"
      width="570"
      height="270"
		rx="34"
		class="guest-tag__paper"
      fill="url(#tagPaper)"
      filter="url(#paperTexture)"
    />

    <rect
      x="65"
      y="185"
      width="570"
      height="270"
		rx="34"
		class="guest-tag__paper-highlight"
      fill="url(#tagHighlight)"
    />

    <rect
      x="68"
      y="188"
      width="564"
      height="264"
		rx="31"
		class="guest-tag__paper-bevel"
      fill="none"
      stroke="#ffffff"
      stroke-width="5"
      opacity=".55"
    />

    <path
      d="M100 447 H600"
      fill="none"
      stroke="#b9ad96"
      stroke-width="4"
      opacity=".18"
      stroke-linecap="round"
    />

    <rect
      x="88"
      y="207"
      width="524"
      height="226"
		rx="24"
		class="guest-tag__paper-keyline"
      fill="none"
      stroke="var(--apeiron-cover-recipient-border-color, url(#tagGold))"
      stroke-width="var(--tag-border-width, 5)"
    />

    <rect
      x="91"
      y="210"
      width="518"
      height="220"
		rx="21"
		class="guest-tag__paper-keyline-inner"
      fill="none"
      stroke="#fff2bd"
      stroke-width="1.4"
      opacity=".55"
    />
  </g>

  <g filter="url(#metalShadow)">
    <rect
      x="341"
      y="151"
      width="18"
      height="61"
      rx="9"
      fill="url(#tagGold)"
    />

    <rect
      x="344"
      y="154"
      width="4"
      height="54"
      rx="2"
      fill="#fff4c0"
      opacity=".52"
    />

    <circle
      cx="350"
      cy="205"
      r="21"
      fill="url(#tagGold)"
    />

    <circle
      cx="350"
      cy="205"
      r="13"
      fill="#805416"
    />

    <circle
      cx="350"
      cy="205"
      r="7"
      fill="#e5c578"
    />
  </g>
</svg>
