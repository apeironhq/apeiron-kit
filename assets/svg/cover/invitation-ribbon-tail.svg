<svg
  class="invitation-ribbon-tail"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 400 560"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <linearGradient id="tailBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--tail-light, #861b3d)" />
      <stop offset="28%" stop-color="var(--tail-main, #68122f)" />
      <stop offset="65%" stop-color="var(--tail-mid, #731431)" />
      <stop offset="100%" stop-color="var(--tail-dark, #4b0a20)" />
    </linearGradient>

    <linearGradient id="tailHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".13"/>
      <stop offset="14%" stop-color="#ffffff" stop-opacity=".035"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".10"/>
    </linearGradient>

    <linearGradient id="tailGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--gold-light, #fff0b8)"/>
      <stop offset="20%" stop-color="var(--gold, #d7ad5d)"/>
      <stop offset="48%" stop-color="var(--gold-dark, #976521)"/>
      <stop offset="72%" stop-color="var(--gold, #d7ad5d)"/>
      <stop offset="100%" stop-color="var(--gold-light, #f7dda0)"/>
    </linearGradient>

    <filter id="tailTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".035 .45"
        numOctaves="3"
        seed="24"
        result="noise"
      />

      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="grayNoise"
      />

      <feComponentTransfer in="grayNoise" result="softNoise">
        <feFuncA type="table" tableValues="0 .10"/>
      </feComponentTransfer>

      <feBlend
        in="SourceGraphic"
        in2="softNoise"
        mode="soft-light"
      />
    </filter>

    <filter id="tailShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="7"
        stdDeviation="7"
        flood-color="#000"
        flood-opacity=".20"
      />
    </filter>

    <filter id="goldTailGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow
        dx="0"
        dy="1"
        stdDeviation="1.4"
        flood-color="#f5d68a"
        flood-opacity=".25"
      />
    </filter>

    <clipPath id="tailClip">
      <path
        d="
          M55 35
          Q55 24 67 24
          H333
          Q345 24 345 35
          V470
          L200 535
          L55 470
          Z
        "
      />
    </clipPath>
  </defs>

  <g filter="url(#tailShadow)">
    <path
      d="
        M55 35
        Q55 24 67 24
        H333
        Q345 24 345 35
        V470
        L200 535
        L55 470
        Z
      "
      fill="url(#tailBase)"
      filter="url(#tailTexture)"
    />

    <path
      d="
        M55 35
        Q55 24 67 24
        H333
        Q345 24 345 35
        V470
        L200 535
        L55 470
        Z
      "
      fill="url(#tailHighlight)"
      opacity=".75"
    />

    <path
      d="
        M55 35
        L71 35
        L71 462
        L200 520
        L200 535
        L55 470
        Z
      "
      fill="#260711"
      opacity=".17"
    />

    <path
      d="
        M329 35
        H345
        V470
        L200 535
        L200 520
        L329 462
        Z
      "
      fill="#260711"
      opacity=".16"
    />

    <path
      d="
        M67 25
        H333
        Q344 25 344 36
        V45
        H56
        V36
        Q56 25 67 25
        Z
      "
      fill="#ffffff"
      opacity=".08"
    />

    <path
      d="
        M55 35
        Q55 24 67 24
        H333
        Q345 24 345 35
        V470
        L200 535
        L55 470
        Z
      "
      fill="none"
      stroke="url(#tailGold)"
      stroke-width="var(--tail-edge-width, 7)"
      filter="url(#goldTailGlow)"
    />

    <path
      d="
        M64 38
        V463
        L200 524
        L336 463
        V38
      "
      fill="none"
      stroke="#39101c"
      stroke-width="5"
      opacity=".72"
    />

    <path
      d="
        M68 39
        V458
        L200 517
        L332 458
        V39
      "
      fill="none"
      stroke="url(#tailGold)"
      stroke-width="3.2"
      opacity=".96"
    />

    <path
      d="
        M78 48
        V449
        L200 504
        L322 449
        V48
      "
      fill="none"
      stroke="var(--stitch-color, #dfbc72)"
		stroke-width="calc(var(--stitch-width, 3) * 1.1)"
      stroke-dasharray="9 7"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity=".96"
    />

    <path
      d="
        M80 50
        V451
        L200 507
        L320 451
        V50
      "
      fill="none"
      stroke="#20050d"
      stroke-width="2"
      stroke-dasharray="9 7"
      stroke-linecap="round"
      opacity=".23"
    />

    <path
      d="
        M59 36
        V467
        L200 530
      "
      fill="none"
      stroke="#ffffff"
      stroke-width="1.4"
      opacity=".10"
    />

    <path
      d="
        M341 36
        V467
        L200 530
      "
      fill="none"
      stroke="#000000"
      stroke-width="1.4"
      opacity=".20"
    />
  </g>
</svg>
