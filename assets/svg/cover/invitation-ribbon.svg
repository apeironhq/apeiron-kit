<svg
  class="invitation-ribbon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="8 0 1784 170"
  preserveAspectRatio="none"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <linearGradient id="ribbonBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--ribbon-top, #7a1536)" />
      <stop offset="18%" stop-color="var(--ribbon-main, #5e0d27)" />
      <stop offset="50%" stop-color="var(--ribbon-mid, #68112d)" />
      <stop offset="82%" stop-color="var(--ribbon-main, #5e0d27)" />
      <stop offset="100%" stop-color="var(--ribbon-bottom, #43101e)" />
    </linearGradient>

    <linearGradient id="centerLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--gold-light, #f6e2a5)" />
      <stop offset="35%" stop-color="var(--gold-main, #d6ad62)" />
      <stop offset="70%" stop-color="var(--gold-dark, #9f7128)" />
      <stop offset="100%" stop-color="var(--gold-light, #f8e7b8)" />
    </linearGradient>

    <filter id="ribbonTexture" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.85"
        numOctaves="2"
        seed="7"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>

    <filter id="ribbonShadow" x="-5%" y="-20%" width="110%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <clipPath id="ribbonClip">
      <rect x="8" y="8" width="1784" height="154" rx="3" ry="3"/>
    </clipPath>
  </defs>

  <g filter="url(#ribbonShadow)">
    <rect
      x="8"
      y="8"
      width="1784"
      height="154"
      rx="3"
      ry="3"
      fill="url(#ribbonBase)"
    />

    <g clip-path="url(#ribbonClip)" opacity="0.95">
      <rect x="8" y="8" width="1784" height="154" filter="url(#ribbonTexture)" />
    </g>

    <rect
      x="8"
      y="8"
      width="1784"
      height="154"
      rx="3"
      ry="3"
      fill="url(#centerLight)"
    />

    <rect
      x="8"
      y="8"
      width="1784"
      height="10"
      rx="2"
      fill="#ffffff"
      opacity="0.08"
    />

    <rect
      x="8"
      y="152"
      width="1784"
      height="10"
      rx="2"
      fill="#000000"
      opacity="0.10"
    />

    <rect
      x="8"
      y="10"
		width="1784"
		height="3.5"
		class="invitation-ribbon__edge invitation-ribbon__edge--top"
      fill="url(#goldLine)"
    />

    <rect
      x="8"
      y="156.5"
		width="1784"
		height="3.5"
		class="invitation-ribbon__edge invitation-ribbon__edge--bottom"
      fill="url(#goldLine)"
    />

    <line
      x1="18"
      y1="30"
      x2="1782"
      y2="30"
      stroke="var(--stitch-color, #d8b66e)"
		stroke-width="var(--stitch-width, 3)"
      stroke-dasharray="8 6"
      stroke-linecap="round"
      opacity="0.95"
    />

    <line
      x1="18"
      y1="140"
      x2="1782"
      y2="140"
      stroke="var(--stitch-color, #d8b66e)"
		stroke-width="var(--stitch-width, 3)"
      stroke-dasharray="8 6"
      stroke-linecap="round"
      opacity="0.95"
    />

    <rect x="8" y="8" width="12" height="154" fill="#000000" opacity="0.08"/>
    <rect x="1780" y="8" width="12" height="154" fill="#000000" opacity="0.08"/>

    <rect x="8" y="8" width="2.5" height="154" fill="url(#goldLine)" opacity="0.85"/>
    <rect x="1789.5" y="8" width="2.5" height="154" fill="url(#goldLine)" opacity="0.85"/>
  </g>
</svg>
