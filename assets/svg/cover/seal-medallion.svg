<svg
  class="invitation-seal"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 800"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <radialGradient id="centerFill" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="var(--seal-color-light, #7d1436)" />
      <stop offset="55%" stop-color="var(--seal-color, #5f0f28)" />
      <stop offset="100%" stop-color="var(--seal-color-dark, #3e0718)" />
    </radialGradient>

    <linearGradient id="ringFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--seal-ring-light, #7a1535)" />
      <stop offset="50%" stop-color="var(--seal-ring, #4b0b1f)" />
      <stop offset="100%" stop-color="var(--seal-ring-dark, #2f0411)" />
    </linearGradient>

    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--gold-light, #f6df9a)" />
      <stop offset="35%" stop-color="var(--gold, #d8b56a)" />
      <stop offset="65%" stop-color="var(--gold-dark, #a97a2f)" />
      <stop offset="100%" stop-color="var(--gold-light, #f8e8b4)" />
    </linearGradient>

    <linearGradient id="goldThin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3c7" />
      <stop offset="40%" stop-color="var(--gold, #d8b56a)" />
      <stop offset="100%" stop-color="#9e6e22" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f3d98b" flood-opacity="0.25"/>
    </filter>

    <filter id="texture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.9"
        numOctaves="2"
        seed="9"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="monoNoise"
      />
      <feComponentTransfer in="monoNoise" result="softNoise">
        <feFuncA type="table" tableValues="0 0.04"/>
      </feComponentTransfer>
    </filter>

    <clipPath id="clipCenter">
      <circle cx="400" cy="400" r="278"/>
    </clipPath>

    <radialGradient id="highlightTop" cx="50%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#shadow)">
    <circle
      cx="400"
      cy="400"
      r="350"
      fill="url(#ringFill)"
      stroke="url(#goldStroke)"
      stroke-width="var(--seal-ring-width, 10)"
    />

    <circle
      cx="400"
      cy="400"
      r="338"
      fill="none"
      stroke="rgba(255,255,255,0.12)"
      stroke-width="3"
    />

    <circle
      cx="400"
      cy="400"
      r="306"
      fill="none"
      stroke="url(#goldStroke)"
      stroke-width="calc(var(--seal-ring-width, 10) * .8)"
      filter="url(#softGlow)"
    />

    <circle
      cx="400"
      cy="400"
      r="278"
      fill="url(#centerFill)"
    />

    <g clip-path="url(#clipCenter)" opacity="0.9">
      <rect x="110" y="110" width="580" height="580" filter="url(#texture)" />
    </g>

    <circle cx="400" cy="400" r="278" fill="url(#highlightTop)" />
  </g>

  <g
    transform="translate(400 215)"
    stroke="url(#goldThin)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  >
    <path d="M-150 0 C-120 -2 -110 -18 -92 -18 C-70 -18 -62 4 -36 2" />
    <path d="M150 0 C120 -2 110 -18 92 -18 C70 -18 62 4 36 2" />

    <g transform="translate(0 -2)">
      <path d="M0 -22 L26 0" />
      <path d="M0 -22 L0 2" />
      <path d="M0 -22 L-26 0" />
      <path d="M-26 0 L0 22 L26 0 Z" fill="none"/>
      <path d="M-16 0 L0 18 L16 0" />
      <path d="M-8 -8 L0 14 L8 -8" />
    </g>
  </g>

  <g
    transform="translate(400 585)"
    stroke="url(#goldThin)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  >
    <path d="M-150 0 C-120 2 -110 18 -92 18 C-70 18 -62 -4 -36 -2" />
    <path d="M150 0 C120 2 110 18 92 18 C70 18 62 -4 36 -2" />

    <g transform="translate(0 2)">
      <path d="M0 22 L26 0" />
      <path d="M0 22 L0 -2" />
      <path d="M0 22 L-26 0" />
      <path d="M-26 0 L0 -22 L26 0 Z" fill="none"/>
      <path d="M-16 0 L0 -18 L16 0" />
      <path d="M-8 8 L0 -14 L8 8" />
    </g>
  </g>
</svg>
